x-worker-base: &worker-base
  build:
    context: .
    dockerfile: apps/worker/Dockerfile
    target: ${TARGET:-development}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  env_file: .env
  volumes:
    - ./apps/worker:/app/apps/worker
    - ./packages:/app/packages
    - ./prisma:/app/prisma
    # No anon volume for /app/node_modules: workspace deps hoist there from the
    # image, so `docker compose up -d --build` updates them. (An anon volume here
    # persists across rebuilds and would shadow new deps with a stale tree.)
    - /app/apps/worker/node_modules
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${TARGET:-development}
      args:
        MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    command: ["npx", "next", "dev", "--turbo", "--hostname", "0.0.0.0"]
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./prisma:/app/prisma
      # No anon volume for /app/node_modules: workspace deps hoist there from the
      # image, so `docker compose up -d --build` updates them. (An anon volume here
      # persists across rebuilds and would shadow new deps with a stale tree.)
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    restart: unless-stopped

  worker-download:
    <<: *worker-base
    # Repeats postgres and redis on purpose: a `depends_on` here REPLACES the
    # anchor's rather than merging with it, so omitting them would silently
    # drop the database and queue ordering.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # service_started, NOT service_healthy. Only URL downloads use the proxy;
      # an uploaded file needs nothing from WARP, and an unhealthy proxy must
      # not stop this worker from draining those jobs.
      warp:
        condition: service_started
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=download
      - DOWNLOAD_CONCURRENCY=4
      - CHOKIDAR_USEPOLLING=true

  worker-transcribe:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=transcribe
      - TRANSCRIBE_CONCURRENCY=2
      - CHOKIDAR_USEPOLLING=true

  worker-analyze:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=analyze
      - ANALYZE_CONCURRENCY=5
      - CHOKIDAR_USEPOLLING=true

  worker-render:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=render
      - RENDER_CONCURRENCY=1
      - CHOKIDAR_USEPOLLING=true

  worker-finalize:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=finalize
      - FINALIZE_CONCURRENCY=3
      - CHOKIDAR_USEPOLLING=true

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_STAT: "1"
    expose:
      - "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
      target: ${TARGET:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      telegram-bot-api:
        condition: service_started
      # service_started, NOT service_healthy: WARP is needed only to PROBE a
      # pasted link. Gating the whole bot on it would take chat, uploads,
      # settings and support down with the proxy.
      warp:
        condition: service_started
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHOKIDAR_USEPOLLING=true
      - TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081
    volumes:
      - ./apps/bot:/app/apps/bot
      - ./packages:/app/packages
      - ./prisma:/app/prisma
      # No anon volume for /app/node_modules: workspace deps hoist there from the
      # image, so `docker compose up -d --build` updates them. (An anon volume here
      # persists across rebuilds and would shadow new deps with a stale tree.)
      - /app/apps/bot/node_modules
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: clipclap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clipclap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipclap"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

  # GVS PO-token provider for yt-dlp (spec 2026-08-19-youtube-flap-survival 2).
  # YouTube demands a Proof-of-Origin token for googlevideo streaming from
  # suspicious IPs - the "metadata fine, every segment 403" mode our pinned
  # WARP exit falls into. The three yt-dlp images carry the plugin; it calls
  # this sidecar only when YTDLP_POT_PROVIDER_URL points here, and a down
  # sidecar degrades to tokenless - so this service can be removed without
  # touching anything else. Never published to the host.
  # NOTE (2026-08-20): routing this sidecar through WARP is almost certainly
  # REQUIRED - yt-dlp's own PO-token guide says the token must be generated
  # from the same IP that fetches the media, and right now this mints from the
  # host address while yt-dlp fetches through WARP, which matches the symptom
  # exactly (extraction fine, every media URL a bare 403).
  #
  # It could not be done with a SOCKS proxy: with ALL_PROXY (with or without
  # HTTPS_PROXY) the provider dies on "Could not get BotGuard challenge ...
  # AssertionError: protocol mismatch" - its HTTP client will not take a socks
  # agent - and then mints nothing at all, so mweb returns no formats and the
  # failure gets WORSE. Measured and reverted 2026-08-20.
  #
  potprovider:
    # Built from a local clone of upstream master (docker/bgutil-src, commit
    # a0be235, 2026-08-19 "[deps] update dependencies and sync with upstream"):
    # the 1.3.1 release image is from March and its minted tokens hit YouTube's
    # video-id-binding/BotGuard churn of Aug 2026 - mweb downloads died at the
    # first chunk boundary (~10MB) with the release sidecar. No newer image is
    # published, so we build the server_node target ourselves. To update:
    # git -C docker/bgutil-src pull && docker compose build potprovider.
    build:
      context: ./docker/bgutil-src/server
      target: server_node
    init: true
    # THE TOKEN MUST BE MINTED FROM THE SAME EGRESS THAT FETCHES THE MEDIA.
    #
    # yt-dlp's PO-token guide requires it: a GVS token is tied to the address
    # that asked for it. Without this the sidecar minted from this host's own
    # address - the one YouTube refuses outright - while yt-dlp fetched through
    # WARP, so the token never matched the fetch. The symptom was a bare 403 on
    # every media URL while extraction and the token call both looked healthy:
    # six consecutive URL jobs from four users, 2026-08-18 to 08-20, zero done.
    #
    # http://, NOT socks5://. The provider's HTTP client refuses a socks agent
    # ("Could not get BotGuard challenge ... AssertionError: protocol mismatch")
    # and then mints nothing at all, which is worse than the 403 - measured and
    # reverted 2026-08-20. gost in the warp container listens in auto mode on
    # 1080 and answers HTTP CONNECT there as well as SOCKS5, so this needs no
    # change to warp itself.
    # ENABLED 2026-08-20, third attempt - through connect4 on 1081, NOT gost's
    # own 1080. Candidate 1 below was CONFIRMED by measurement: api64.ipify
    # answered 2a09:bac5:... (IPv6) through http://, socks5:// and socks5h://
    # alike from inside the warp container, so gost's CONNECT egress was the
    # IPv6 exit - the one section 8 measured as bot-refused on the FIRST
    # probe - while yt-dlp takes the pinned IPv4 one. The 400 on /att/get was
    # that mismatch. connect4.py resolves A records only and dials IPv4, so
    # the token now mints from the same exit that fetches the media.
    environment:
      - ALL_PROXY=http://warp:1081
      - NO_PROXY=localhost,127.0.0.1
    depends_on:
      warp:
        condition: service_started
    #
    # 2026-08-20, second attempt: over http:// the proxy DOES work (the socks
    # "protocol mismatch" is gone and the log shows "Using proxy:
    # http://warp:1080/"), but YouTube then answers 400 on
    # /youtubei/v1/att/get and the sidecar mints nothing - worse than the 403 it
    # was meant to fix, so it is off again.
    #
    # Two candidate explanations (resolved 2026-08-20: it was 1):
    #   1. gost resolves remotely on CONNECT and may leave over the IPv6 exit,
    #      while yt-dlp deliberately uses socks5:// with local DNS in a v4-only
    #      container to get the IPv4 one (engine-notes section 8). Different
    #      exit family would defeat the whole point AND could explain the 400.
    #   2. The exit was measured heavily that afternoon, and section 8 warns
    #      that a burnt exit answers oddly. The 400 may simply be that.
    expose:
      - "4416"
    restart: unless-stopped

  # Cloudflare WARP as a SOCKS5 exit for yt-dlp ONLY.
  #
  # YouTube refuses this host's Hetzner address outright - "Sign in to confirm
  # you're not a bot" - on IPv4 and IPv6 alike, and every documented workaround
  # (player clients, PO tokens, a JS runtime, the Invidious fallback, a newer
  # yt-dlp) was measured and failed. Routing yt-dlp through WARP is the one that
  # worked: 12/12 metadata and a full 155 MB download at 10.8 MiB/s.
  #
  # Nothing else in the stack goes through here. Only the two yt-dlp call sites
  # opt in, via YTDLP_PROXY.
  warp:
    build:
      context: ./docker/warp
    expose:
      - "1080"   # SOCKS5, for yt-dlp
      - "1081"   # IPv4-only HTTP CONNECT (connect4.py), for the PO-token sidecar
      - "8080"   # rotate/health control, compose network only - never published
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    # NO named volume for /var/lib/cloudflare-warp ON PURPOSE. The stock
    # entrypoint skips registration when reg.json already exists, so persisting
    # it would pin us to one exit address forever - the opposite of what this
    # service is for. A fresh container is a fresh registration - which as of
    # 2026-08-16 does NOT mean a fresh IPv4 exit any more (measured 08-18:
    # 104.28.193.116 survives reconnects, re-registration and a protocol
    # switch; see docker/warp/control.py). Kept anyway: it costs nothing and
    # is the state the mapping may return to.
    healthcheck:
      # Proves the PROXY PATH reaches the internet, not merely that a daemon is
      # up: /health reads the egress address through the SOCKS port itself.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 15s
      # WARP registration plus first connect is slow, and downloads must not be
      # scheduled against a proxy that is not carrying traffic yet.
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  telegram-bot-api-data:
