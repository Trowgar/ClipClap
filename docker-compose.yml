x-worker-base: &worker-base
  build:
    context: .
    dockerfile: apps/worker/Dockerfile
    target: ${TARGET:-development}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  env_file: .env
  volumes:
    - ./apps/worker:/app/apps/worker
    - ./packages:/app/packages
    - ./prisma:/app/prisma
    - /app/node_modules
    - /app/apps/worker/node_modules
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${TARGET:-development}
    command: ["npx", "next", "dev", "--turbo", "--hostname", "0.0.0.0"]
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./prisma:/app/prisma
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    restart: unless-stopped

  worker-download:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=download
      - DOWNLOAD_CONCURRENCY=4
      - CHOKIDAR_USEPOLLING=true

  worker-transcribe:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=transcribe
      - TRANSCRIBE_CONCURRENCY=2
      - CHOKIDAR_USEPOLLING=true

  worker-analyze:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=analyze
      - ANALYZE_CONCURRENCY=5
      - CHOKIDAR_USEPOLLING=true

  worker-render:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=render
      - RENDER_CONCURRENCY=1
      - CHOKIDAR_USEPOLLING=true

  worker-finalize:
    <<: *worker-base
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WORKER_ROLE=finalize
      - FINALIZE_CONCURRENCY=3
      - CHOKIDAR_USEPOLLING=true

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: clipfast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clipfast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipfast"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
