# ClipClap server-level policy. Include once inside the TLS server block.
access_log /var/log/nginx/clipclap.access.log combined;
client_max_body_size 1m;

limit_req_status 429;
limit_conn_status 429;
limit_conn clipclap_conn 30;
limit_req zone=clipclap_dynamic burst=30 nodelay;
limit_req zone=clipclap_auth burst=5 nodelay;
limit_req zone=clipclap_action burst=10 nodelay;

if ($clipclap_scan) {
    return 444;
}

if ($clipclap_wp_rest_probe) {
    return 444;
}

location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
