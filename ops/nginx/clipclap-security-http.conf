# Shared ClipClap abuse controls. This file is loaded in nginx's http context.
# An empty key bypasses a zone. OAuth callbacks are deliberately absent: only
# password-backed unauthenticated POSTs receive the strict auth budget.
map "$request_method:$uri" $clipclap_auth_limit_key {
    default "";
    "POST:/api/register" $binary_remote_addr;
    "POST:/api/auth/forgot" $binary_remote_addr;
    "POST:/api/auth/reset" $binary_remote_addr;
    "POST:/api/auth/callback/credentials" $binary_remote_addr;
}

map $http_next_action $clipclap_action_limit_key {
    default $binary_remote_addr;
    "" "";
}

# Immutable build assets do not consume the general dynamic request budget.
map $uri $clipclap_dynamic_limit_key {
    default $binary_remote_addr;
    ~^/_next/static/ "";
    ~^/_next/image(?:/|$) "";
}

# These paths cannot be valid ClipClap routes. Drop them without giving a
# scanner a framework response or a useful distinction between probes.
map $uri $clipclap_scan {
    default 0;
    ~*^/(?:wp-admin|wp-content|wp-includes|wp-json)(?:/|$) 1;
    ~*^/(?:wp-login\.php|xmlrpc\.php)(?:/|$) 1;
    ~*^/(?:phpmyadmin|pma|adminer)(?:/|$|\.) 1;
    ~*(?:^|/)\.(?:env(?:\.|/|$)|git(?:/|$)|svn(?:/|$)|hg(?:/|$)|aws(?:/|$)) 1;
    ~*^/(?:\.DS_Store|composer\.(?:json|lock)|server-status)(?:/|$) 1;
    ~*\.(?:php\d*|phtml|phar|asp|aspx|cgi)$ 1;
}

map $arg_rest_route $clipclap_wp_rest_probe {
    default 0;
    ~*^/?wp(?:/|$) 1;
}

limit_req_zone $clipclap_dynamic_limit_key zone=clipclap_dynamic:10m rate=10r/s;
limit_req_zone $clipclap_auth_limit_key zone=clipclap_auth:10m rate=5r/m;
limit_req_zone $clipclap_action_limit_key zone=clipclap_action:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=clipclap_conn:10m;
